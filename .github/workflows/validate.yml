name: Validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate JSON and local Markdown links
        run: python3 scripts/validate.py
      - name: Validate contracts
        run: python3 scripts/validate_contracts.py
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Evaluate passing fixture
        run: python3 scripts/evaluate.py evaluations/fixtures/good-run.json
      - name: Verify executable benchmark smoke test
        run: python3 scripts/run_benchmark.py evaluations/benchmarks/stdlib-smoke.json --cwd . --output /tmp/playbook-smoke-evidence.json
